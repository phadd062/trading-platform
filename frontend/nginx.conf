server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ---- API + auth → FastAPI backend ----
  # proxy_pass has NO trailing path, so nginx forwards the full URI unchanged:
  #   /token/login  → <backend>/token/login
  #   /api/orders   → <backend>/api/orders
  #
  # Backend target depends on how you run this container:
  #   • frontend container, backend exposed on the host (docker-compose maps 8000:8000)
  #       → http://host.docker.internal:8000   ← default below
  #   • frontend added to the SAME docker-compose network as the api service
  #       → http://api:8000
  #   • nginx running natively on the host (not in Docker)
  #       → http://127.0.0.1:8000
  location /api/ {
    proxy_pass http://host.docker.internal:8000;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /token/ {
    proxy_pass http://host.docker.internal:8000;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ---- SPA fallback ----
  # Everything else serves the Angular app; the router handles deep links / refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
